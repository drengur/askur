[project]
name = "askur"
version = "0.2.3b1"
description = "Memory mapped binary tree for fast key-value lookup"
readme = "README.md"
authors = [
    { name = "Samúel Þórisson", email = "samuel.thorisson@gmail.com" }
]

requires-python = ">=3.10"
dependencies = [
    "psutil>=5.8.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]

license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/drengur/askur"
Issues = "https://github.com/drengur/askur/issues"
Repository = "https://github.com/drengur/askur"

[project.scripts]
askur-search = "askur.search:main"
askur-get_id = "askur.__init__:get_id"
askur-build = "askur.build:main"
askur-remove = "askur.__init__:remove_collection"
askur-rename = "askur.__init__:rename_collection"
askur-list_collections = "askur.__init__:list_collections"
askur-list_config = "askur.__init__:list_configuration"

# Exclude files from distribution
[tool.setuptools.exclude-package-data]
askur = [ "tests/*","drasl/*" ]
